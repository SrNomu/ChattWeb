<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChattWeb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  
<div id="app">
  <aside id="sidebar">
      <div class="icons">
        <div class="icon-wrapper" onclick="switchView('whatsapp1')">
          <img class="icon-img" src="../assets/icons/whatsapp.png" alt="WhatsApp 1">
        </div>

        <div class="icon-wrapper" onclick="switchView('whatsapp2')">
          <img class="icon-img" src="../assets/icons/whatsappB.png" alt="WhatsApp 2">
        </div>

        <div class="icon-wrapper" onclick="switchView('telegram')">
          <img class="icon-img" src="../assets/icons/telegram.png" alt="Telegram">
        </div>

        <div class="icon-wrapper" onclick="switchView('messenger')">
          <img class="icon-img" src="../assets/icons/messenger.png" alt="Messenger">
        </div>

        <div class="icon-wrapper" onclick="switchView('line')">
          <img class="icon-img" src="../assets/icons/line.png" alt="Line">
        </div>
      </div>


  </aside>
  <main id="content">
    <div id="placeholder">
      <h2>Bem-vindo ao ChattWeb</h2>
      <p>As views dos serviços aparecem à direita.</p>
    </div>
  </main>
</div>
<script src="renderer.js"></script>
</body>
</html>
